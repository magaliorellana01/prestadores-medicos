name: Keep Render awake

on:
  schedule:
    # Cada 10 minutos (GitHub puede demorar algunos minutos los cron)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS -m 60 --retry 3 --retry-delay 10 https://prestadores-medicos.onrender.com/health
